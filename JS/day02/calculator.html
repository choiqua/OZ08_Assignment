<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>과제하기 싫은사람 여기여기 모여라</title>
  <script src="./caldulator.js" defer></script>
</head>
<body>
  <h1>콘솔창 계산기 프로그램</h1>
  <h2>Window OS의 경우</h2>
  <hr>
  <div>1. F12 키를 눌러 콘솔창을 여세요.</div>
  <div>2. start()를 콘솔창에 입력하여 계산기를 실행합니다</div>
  <h2>Mac OS의 경우</h2>
  <hr>
  <div>1. Option + Command + i 키를 눌러 콘솔 창을 여세요</div>
  <div>2. Start()를 콘솔창에 입력하여 계산기를 실행합니다.</div>
  <div>3. 근데 맥에서도 F12눌러도 됩니다.</div>
  <div>귀찮게 이상한거 누르지 마시고 F12 누르세요.</div>
  <script src="./calculator.js" defer="defer"></script>
<br>
<hr>
<div>오늘도 이상한짓을 시작하는 재영씨다</div>
</body>
</html>
